name: Deploy Server

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/deploy.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # Run in the same image the production Dockerfile is built FROM, so CI
    # tests the exact bun + apt-ffmpeg combo production runs. Keep this tag in
    # sync with server/Dockerfile.
    container: oven/bun:1.3.14
    steps:
      - uses: actions/checkout@v4

      # ffmpeg so the media-pipeline tests run instead of skipIf-ing; build
      # tools because better-sqlite3 (drizzle-kit's driver) compiles via
      # node-gyp and the bare oven/bun image has no toolchain.
      - name: Install system deps
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ffmpeg python3 make g++

      - name: Install dependencies
        run: cd server && bun install --frozen-lockfile

      # Same command developers run locally (via `bun run check:all` at the
      # repo root, which adds the macOS app checks CI can't run).
      - name: Check (lint, format, typecheck, tests)
        run: |
          set -o pipefail
          cd server && bun run check:all 2>&1 | tee /tmp/checks.txt

      # The media-pipeline tests skipIf ffmpeg is missing; a skip here means
      # the deploy gate isn't testing the code that guards footage.
      # Exception: the "processAudio (chain effects)" tests also need macOS
      # `say` to synthesise real speech, so they always skip on Linux.
      - name: Fail on unexpected skipped tests
        run: |
          unexpected=$(grep -E '^\(skip\)' /tmp/checks.txt | grep -v 'processAudio (chain effects)' | sort -u || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected skipped tests — is ffmpeg missing on the runner?"
            echo "$unexpected"
            exit 1
          fi

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/loom-clone
            git fetch --prune origin
            git reset --hard origin/main
            cd server
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
            docker image prune -f
            docker builder prune -f --filter until=168h
