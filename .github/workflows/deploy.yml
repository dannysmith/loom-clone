name: Deploy Server

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/deploy.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Run in the same image the production Dockerfile is built FROM, so CI
    # tests the exact bun + apt-ffmpeg combo production runs. Keep this
    # tag + digest in sync with server/Dockerfile.
    container: oven/bun:1.3.14@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ffmpeg so the media-pipeline tests run instead of skipIf-ing. The
      # version assertion mirrors the guard in server/Dockerfile.
      - name: Install system deps
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffmpeg -version | head -1 | grep -q "ffmpeg version 7\." || {
            echo "::error::ffmpeg major version drifted from the pinned 7.x — keep in sync with server/Dockerfile"
            exit 1
          }

      # The admin-client and player sub-packages need their own installs:
      # check:all typechecks both, and the build/verify steps below compile
      # them.
      #
      # --ignore-scripts on the server install: the only scripted dependency
      # is better-sqlite3 (drizzle-kit's CLI driver), whose node-gyp build
      # needs a node toolchain the oven/bun image doesn't have — and nothing
      # in CI invokes drizzle-kit; the server and tests use bun:sqlite.
      - name: Install dependencies
        run: |
          cd server && bun install --frozen-lockfile --ignore-scripts
          cd admin-client && bun install --frozen-lockfile
          cd ../player && bun install --frozen-lockfile

      # Same command developers run locally (via `bun run check:all` at the
      # repo root, which adds the macOS app checks CI can't run).
      - name: Check (lint, format, typecheck, tests)
        run: |
          set -o pipefail
          cd server && bun run check:all 2>&1 | tee /tmp/checks.txt

      # The admin client is built by the production Dockerfile, so a broken
      # build would otherwise first surface as a failed docker build on the
      # VPS. Build it here so failures land in GitHub instead.
      - name: Build admin client
        run: cd server && bun run admin-client:build

      # public/player/ is a committed build artefact (see server/CLAUDE.md).
      # Rebuild it and fail if the output differs from what's committed, so
      # player/src and the committed bundle can't silently diverge.
      - name: Verify committed player bundle matches source
        run: |
          cd server && bun run player:build
          if [ -n "$(git status --porcelain -- public/player)" ]; then
            echo "::error::public/player/ is out of sync with player/ source — run 'bun run player:build' in server/ and commit the result"
            git status --porcelain -- public/player
            git diff -- public/player | head -100
            exit 1
          fi

      # The media-pipeline tests skipIf ffmpeg is missing; a skip here means
      # the deploy gate isn't testing the code that guards footage.
      # Exception: the "processAudio (chain effects)" tests also need macOS
      # `say` to synthesise real speech, so they always skip on Linux.
      # Bun 1.3 marks skips with "(skip)"; "»" is matched too in case a
      # future Bun changes the marker.
      - name: Fail on unexpected skipped tests
        run: |
          unexpected=$(grep -E '^(\(skip\)|»)' /tmp/checks.txt | grep -v 'processAudio (chain effects)' | sort -u || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected skipped tests — is ffmpeg missing on the runner?"
            echo "$unexpected"
            exit 1
          fi

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/loom-clone
            git fetch --prune origin
            git reset --hard origin/main
            cd server
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
            docker image prune -f
            # Best-effort cache cleanup — never fail a completed deploy.
            docker builder prune -f --filter until=168h || true
