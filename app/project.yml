name: LoomClone
options:
  bundleIdPrefix: is.danny.loomclone
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.40"
  createIntermediateGroups: true

packages:
  # Exact pin, not a range. This is the app's only third-party dependency and
  # it's pre-1.0, so `from:` resolves to anything below 1.0.0 — on a clean
  # checkout (the xcodeproj, and with it Package.resolved, is gitignored) that
  # could be a different version than the one this code was built against.
  argmax-oss-swift:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: "0.18.0"

settingGroups:
  codeQuality:
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: true
    GCC_TREAT_WARNINGS_AS_ERRORS: true

settings:
  base:
    # Swift 5 language mode with strict concurrency set to `complete` above:
    # the concurrency diagnostics are on, but the Swift 6 language-mode
    # migration is deliberately deferred. Roughly eight `@unchecked Sendable`
    # / `nonisolated(unsafe)` sites would need revisiting first.
    SWIFT_VERSION: "5"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    groups:
      - codeQuality

targets:
  LoomClone:
    type: application
    platform: macOS
    sources:
      - path: LoomClone
    dependencies:
      - package: argmax-oss-swift
        product: WhisperKit
    settings:
      base:
        INFOPLIST_FILE: LoomClone/Info.plist
        CODE_SIGN_ENTITLEMENTS: LoomClone.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: is.danny.loomclone
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: XT349SJG9U
    postCompileScripts:
      - script: |
          if [ -x /opt/homebrew/bin/swiftlint ]; then
            /opt/homebrew/bin/swiftlint lint --quiet
          elif command -v swiftlint >/dev/null 2>&1; then
            swiftlint lint --quiet
          else
            echo "warning: SwiftLint not installed — install with 'brew install swiftlint'"
          fi
        name: SwiftLint
        basedOnDependencyAnalysis: false

  LoomCloneTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LoomCloneTests
    dependencies:
      - target: LoomClone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: is.danny.loomclone.tests
        GENERATE_INFOPLIST_FILE: true
        DEVELOPMENT_TEAM: XT349SJG9U
